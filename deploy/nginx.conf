# Nginx reverse proxy for KLYP (drop into /etc/nginx/sites-available/klyp).
#   sudo ln -sf /etc/nginx/sites-available/klyp /etc/nginx/sites-enabled/klyp
#   sudo nginx -t && sudo systemctl reload nginx

upstream klyp_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name klyp.example.com;  # ← your domain

    # gzip for text payloads
    gzip on;
    gzip_types text/css application/javascript application/manifest+json application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    location / {
        proxy_pass http://klyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # PWA + long-running analysis polls: keep connections gentle
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Immutable build output — cache hard at the edge
    location /_next/static/ {
        proxy_pass http://klyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brand assets (icons, hero art)
    location ~ ^/(icons|images)/ {
        proxy_pass http://klyp_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # Service worker must never be cached beyond revalidation
    location = /sw.js {
        proxy_pass http://klyp_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
}
